# รันทั้ง stack แบบ DEV (hot reload ทุก service) — bind mount source code + watcher
#   docker compose up -d --build
#
# ทุก service ใช้ multi-stage Dockerfile โดย select `target: dev`
#   - frontend     → Vite dev server + HMR (polling)
#   - user-service → ./mvnw spring-boot:run + spring-boot-devtools restart
#   - ai-service   → uvicorn --reload + WATCHFILES_FORCE_POLLING
#
# เปลี่ยนเป็น production: ลบ `target: dev` ออก (ใช้ default stage = runtime/runner)
#   แล้วลบ volumes ที่ bind source code ออกด้วย
#
# Postgres รันบนเครื่อง host (ไม่ได้อยู่ใน compose) — container เชื่อมผ่าน host.docker.internal

services:
  frontend:
    build:
      context: ./Front/lineapp
      dockerfile: Dockerfile
      target: dev
    container_name: lineapp-frontend
    ports:
      # Vite dev server ฟังที่ 5173 → expose ตรง ๆ (ไม่ใช่ผ่าน nginx)
      - "5173:5173"
    environment:
      # Vite จะอ่าน VITE_* จาก env ก่อน — fallback ไปอ่าน .env บน /app (bind mount)
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
      VITE_LINE_CHANNEL_ID: ${VITE_LINE_CHANNEL_ID:-2009886740}
      VITE_LINE_REDIRECT_URI: ${VITE_LINE_REDIRECT_URI:-http://localhost:5173/callback}
      # polling: bind mount บน Windows host ไม่ส่ง inotify event
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      # source code จาก host → container (HMR จะ pick up การแก้ไฟล์)
      - ./Front/lineapp:/app
      # named volume ทับ /app/node_modules — กันไม่ให้ host เอา node_modules มาทับ
      - frontend-node-modules:/app/node_modules
    depends_on:
      - user-service
    restart: unless-stopped
    networks:
      - lineapp-net

  user-service:
    build:
      context: ./Back/user-service/demo
      dockerfile: Dockerfile
      target: dev
    container_name: lineapp-user-service
    ports:
      - "8080:8080"
    env_file:
      - ./Back/user-service/demo/.env
    environment:
      # Postgres รันบนเครื่อง host — ใช้ host.docker.internal ชี้ออกไปนอก container
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/${POSTGRES_DB:-Lineapp}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-chutiman}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
      # CORS — ต้องเปิดให้ origin ของ frontend (รวม 5173 ทั้ง dev mode + nginx container)
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:4173}
      # HTTP Basic ของ /api/docs (override ผ่าน root .env ได้)
      DOCS_USERNAME: ${DOCS_USERNAME:-admin}
      DOCS_PASSWORD: ${DOCS_PASSWORD:-admin}
      # Spring DevTools — ใช้ polling ตรวจ target/classes (bind mount จาก host)
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: "2s"
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: "1s"
    volumes:
      # source code + pom + target/ จาก host → container
      # IDE compile-on-save จะอัปเดต target/classes/*.class → devtools restart
      - ./Back/user-service/demo:/app
      # Maven local repo เก็บใน named volume → ไม่ต้องโหลด deps ใหม่ทุกครั้งที่ rebuild
      - user-service-m2:/root/.m2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - lineapp-net

  ai-service:
    build:
      context: ./Back/ai-service
      dockerfile: Dockerfile
    container_name: lineapp-ai-service
    depends_on:
      - user-service
    ports:
      - "8000:8000"
    env_file:
      - ./Back/ai-service/.env
    environment:
      PYTHONUNBUFFERED: "1"
      # ภายใน docker network เรียก user-service ตามชื่อ service ได้เลย
      LINEAPP_API_BASE: http://user-service:8080
      # bind mount + uvicorn --reload — บังคับ polling ให้เห็นการแก้ไฟล์บน Windows host
      WATCHFILES_FORCE_POLLING: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Back/ai-service/src:/app/src
    command:
      - uvicorn
      - src.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
      - --reload-delay
      - "0.25"
    restart: unless-stopped
    networks:
      - lineapp-net

volumes:
  frontend-node-modules:
  user-service-m2:

networks:
  lineapp-net:
    driver: bridge
