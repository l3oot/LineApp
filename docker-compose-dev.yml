# รันทั้ง stack แบบ DEV (hot reload ทุก service) — bind mount source code + watcher
#   docker compose up -d --build
#
# ทุก service ใช้ multi-stage Dockerfile โดย select `target: dev`
#   - frontend     → Vite dev server + HMR (polling)
#   - user-service → ./mvnw spring-boot:run + spring-boot-devtools restart
#   - ai-service   → uvicorn --reload + WATCHFILES_FORCE_POLLING
#
# เปลี่ยนเป็น production: ลบ `target: dev` ออก (ใช้ default stage = runtime/runner)
#   แล้วลบ volumes ที่ bind source code ออกด้วย
#
# Postgres รันบนเครื่อง host (ไม่ได้อยู่ใน compose) — container เชื่อมผ่าน host.docker.internal

services:
  frontend:
    build:
      context: ./Front/lineapp
      dockerfile: Dockerfile
      target: dev
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_LINE_CHANNEL_ID: ${VITE_LINE_CHANNEL_ID}
        VITE_LINE_REDIRECT_URI: ${VITE_LINE_REDIRECT_URI}
        VITE_LIFF_ID: ${VITE_LIFF_ID}
    container_name: lineapp-frontend
    ports:
      # Vite dev server ฟังที่ 5173 → expose ตรง ๆ (ไม่ใช่ผ่าน nginx)
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_LINE_CHANNEL_ID: ${VITE_LINE_CHANNEL_ID}
      VITE_LINE_REDIRECT_URI: ${VITE_LINE_REDIRECT_URI}
      VITE_LIFF_ID: ${VITE_LIFF_ID}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING}
    volumes:
      # source code จาก host → container (HMR จะ pick up การแก้ไฟล์)
      - ./Front/lineapp:/app
      # named volume ทับ /app/node_modules — กันไม่ให้ host เอา node_modules มาทับ
      - frontend-node-modules:/app/node_modules
    depends_on:
      - user-service
    restart: unless-stopped
    networks:
      - lineapp-net

  user-service:
    build:
      context: ./Back/user-service/demo
      dockerfile: Dockerfile
      target: dev
    container_name: lineapp-user-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SERVER_ADDRESS: ${SERVER_ADDRESS}
      SERVER_PORT: ${SERVER_PORT}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      DOCS_USERNAME: ${DOCS_USERNAME}
      DOCS_PASSWORD: ${DOCS_PASSWORD}
      HCODE_DATA_SOURCE: ${HCODE_DATA_SOURCE}
      HCODE_BASE_URL: ${HCODE_BASE_URL}
      HCODE_USERNAME: ${HCODE_USERNAME}
      HCODE_PASSWORD: ${HCODE_PASSWORD}
      HCODE_PAGE_SIZE: ${HCODE_PAGE_SIZE}
      HCODE_TIMEOUT_SECONDS: ${HCODE_TIMEOUT_SECONDS}
      AGRI_PRICE_BASE_URL: "${AGRI_PRICE_BASE_URL:-https://agriapi.nabc.go.th}"
      AGRI_PRICE_TIMEOUT_SECONDS: "${AGRI_PRICE_TIMEOUT_SECONDS:-20}"
      AGRI_PRICE_MAX_PAGES: "${AGRI_PRICE_MAX_PAGES:-3}"
      WEATHER_API_BASE_URL: "${WEATHER_API_BASE_URL:-https://data.tmd.go.th/nwpapi}"
      WEATHER_API_TOKEN: "${WEATHER_API_TOKEN:-}"
      WEATHER_API_TIMEOUT_SECONDS: "${WEATHER_API_TIMEOUT_SECONDS:-20}"
      WEATHER_API_DURATION_HOURS: "${WEATHER_API_DURATION_HOURS:-24}"
      WEATHER_WARNING_URL: "${WEATHER_WARNING_URL:-https://data.tmd.go.th/api/WeatherWarningNews/v2/}"
      WEATHER_WARNING_UID: "${WEATHER_WARNING_UID:-demo}"
      WEATHER_WARNING_UKEY: "${WEATHER_WARNING_UKEY:-demokey}"
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}
      LINE_CLIENT_ID: ${LINE_CLIENT_ID}
      LINE_CLIENT_SECRET: ${LINE_CLIENT_SECRET}
      LINE_REDIRECT_URI: ${LINE_REDIRECT_URI}
      LINE_LIFF_URL: ${LINE_LIFF_URL}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET}
      AI_PARSE_PATH: ${AI_PARSE_PATH}
      AI_WEATHER_WARNING_PATH: "${AI_WEATHER_WARNING_PATH:-/weather-warning/summarize}"
      AI_WEATHER_BRIEF_PATH: "${AI_WEATHER_BRIEF_PATH:-/weather-brief/summarize}"
      AI_AGRI_PRICE_EXTRACT_PATH: "${AI_AGRI_PRICE_EXTRACT_PATH:-/agri-price/extract}"
      AI_AGRI_PRICE_BRIEF_PATH: "${AI_AGRI_PRICE_BRIEF_PATH:-/agri-price/summarize}"
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_DEVTOOLS_RESTART_ENABLED: ${SPRING_DEVTOOLS_RESTART_ENABLED}
      SPRING_DEVTOOLS_RESTART_POLL_INTERVAL: ${SPRING_DEVTOOLS_RESTART_POLL_INTERVAL}
      SPRING_DEVTOOLS_RESTART_QUIET_PERIOD: ${SPRING_DEVTOOLS_RESTART_QUIET_PERIOD}
    volumes:
      # source code + pom + target/ จาก host → container
      # IDE compile-on-save จะอัปเดต target/classes/*.class → devtools restart
      - ./Back/user-service/demo:/app
      # Maven local repo เก็บใน named volume → ไม่ต้องโหลด deps ใหม่ทุกครั้งที่ rebuild
      - user-service-m2:/root/.m2
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - lineapp-net

  ai-service:
    build:
      context: ./Back/ai-service
      dockerfile: Dockerfile
    container_name: lineapp-ai-service
    depends_on:
      - user-service
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED}
      LINEAPP_API_BASE: ${LINEAPP_API_BASE}
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING}
      api_key_openai: ${api_key_openai}
      api_key_thaillm: ${api_key_thaillm}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Back/ai-service/src:/app/src
    command:
      - uvicorn
      - src.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    restart: unless-stopped
    networks:
      - lineapp-net

volumes:
  frontend-node-modules:
  user-service-m2:

networks:
  lineapp-net:
    driver: bridge
