services:
  # Development — Vite dev server (HMR)
  # Run: docker compose up dev
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./lineapp:/app
      - lineapp_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  # Production — nginx serving built assets
  # Run: docker compose up --build web
  web:
    build:
      context: ./lineapp
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    profiles:
      - prod

volumes:
  lineapp_node_modules:
