<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/yaiphao.png" />
    <title>ยายเภา</title>
    <style>
      html,
      body {
        margin: 0;
        background: #fff;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      #boot-splash img {
        display: block;
        width: min(8.5rem, 42vw);
        height: auto;
        animation: boot-float 2.8s ease-in-out infinite;
      }
      @keyframes boot-float {
        0%,
        100% {
          transform: translateY(8px);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-busy="true" aria-label="กำลังโหลด">
        <img src="/load.png" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
