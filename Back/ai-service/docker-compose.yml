services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lineapp-ai-service
    ports:
      - "8000:8000"
    # โหลดโค้ดจาก host — แก้ไฟล์ใน ./src แล้ว uvicorn --reload จะรีสตาร์ทอัตโนมัติ
    volumes:
      - ./src:/app/src
    command:
      - uvicorn
      - src.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
      - --reload-delay
      - "0.25"
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Windows + bind mount: บังคับ polling เพื่อให้ --reload เห็นการแก้ไฟล์บน host
      WATCHFILES_FORCE_POLLING: "true"
      # user-service รันบนเครื่อง (command) — client ใน container ใช้ host.docker.internal
      # โค้ดจะบังคับ IPv4 อัตโนมัติ (กัน Errno 101 จาก IPv6)
      LINEAPP_API_BASE: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ไฟล์นี้ใช้สำหรับรัน ai-service เดี่ยว ๆ — ถ้าจะรัน user+ai+postgres พร้อมกัน ให้ใช้ Back/docker-compose.yml
# ต้อง restart user-service หลังเพิ่ม server.address=0.0.0.0 ใน application.properties
    restart: unless-stopped
