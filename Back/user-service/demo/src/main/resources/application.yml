spring:
  config:
    import: optional:file:.env[.properties]

app:
  # URL สาธารณะของ backend — LINE ใช้โหลดรูป static ใน Flex (ต้องเป็น HTTPS ใน production)
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

line:
  # LINE Login (OAuth 2.1)
  client-id: ${LINE_CLIENT_ID}
  client-secret: ${LINE_CLIENT_SECRET}
  redirect-uri: ${LINE_REDIRECT_URI}
  # Messaging API (Webhook + Reply/Push)
  channel-access-token: ${LINE_CHANNEL_ACCESS_TOKEN:}
  channel-secret: ${LINE_CHANNEL_SECRET:}
  # URL ฐาน LIFF/Web app สำหรับปุ่ม "แก้ไข" ใน Flex card (เช่น https://liff.line.me/1234567890-AbCdEfGh)
  liff-url: ${LINE_LIFF_URL:}

ai:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  parse-path: ${AI_PARSE_PATH:/parse}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}

hcode:
  base-url: ${HCODE_BASE_URL:https://hcode.moph.go.th}
  username: ${HCODE_USERNAME:}
  password: ${HCODE_PASSWORD:}
  page-size: ${HCODE_PAGE_SIZE:1000}
  timeout-seconds: ${HCODE_TIMEOUT_SECONDS:30}
  # local = ใช้ JSON ใน resources/thai-admin (แนะนำ — HCode ถูก Cloudflare บล็อกจาก server)
  data-source: ${HCODE_DATA_SOURCE:local}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}