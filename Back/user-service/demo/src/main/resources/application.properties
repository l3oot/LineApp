spring.application.name=demo

# รับ connection จากทุก interface — ใน Docker container จำเป็น (host จาก compose อื่นเข้าถึงได้)
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# ค่า default สำหรับรันบน command — override ผ่าน env ตอนรันใน Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Lineapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chutiman}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Security — credential สำหรับเข้า /swagger-ui และ /v3/api-docs (override ผ่าน env)
app.security.docs-username=${DOCS_USERNAME:admin}
app.security.docs-password=${DOCS_PASSWORD:admin}

# CORS — origin ของ frontend (comma-separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# Swagger UI path mapping (default: /swagger-ui/index.html)
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/v3/api-docs