spring.application.name=demo

# รับ connection จากทุก interface — ใน Docker container จำเป็น (host จาก compose อื่นเข้าถึงได้)
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# ค่า default สำหรับรันบน command — override ผ่าน env ตอนรันใน Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Lineapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chutiman}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Security — credential สำหรับเข้า /swagger-ui และ /v3/api-docs (override ผ่าน env)
app.security.docs-username=${DOCS_USERNAME:admin}
app.security.docs-password=${DOCS_PASSWORD:admin}

# CORS — origin ของ frontend (comma-separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# Swagger UI path mapping (default: /swagger-ui/index.html)
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/v3/api-docs

# App / LINE / AI / HCode / JWT configuration
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

line.client-id=${LINE_CLIENT_ID}
line.client-secret=${LINE_CLIENT_SECRET}
line.redirect-uri=${LINE_REDIRECT_URI}
line.channel-access-token=${LINE_CHANNEL_ACCESS_TOKEN:}
line.channel-secret=${LINE_CHANNEL_SECRET:}
line.liff-url=${LINE_LIFF_URL:}

ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
ai.parse-path=${AI_PARSE_PATH:/parse}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:60}

hcode.base-url=${HCODE_BASE_URL:https://hcode.moph.go.th}
hcode.username=${HCODE_USERNAME:}
hcode.password=${HCODE_PASSWORD:}
hcode.page-size=${HCODE_PAGE_SIZE:1000}
hcode.timeout-seconds=${HCODE_TIMEOUT_SECONDS:30}
hcode.data-source=${HCODE_DATA_SOURCE:local}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}