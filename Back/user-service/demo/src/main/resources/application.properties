spring.application.name=demo

# รับ connection จากทุก interface — ใน Docker container จำเป็น (host จาก compose อื่นเข้าถึงได้)
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# ค่า default สำหรับรันบน command — override ผ่าน env ตอนรันใน Docker
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Security — credential สำหรับเข้า /swagger-ui และ /v3/api-docs (override ผ่าน env)
app.security.docs-username=${DOCS_USERNAME}
app.security.docs-password=${DOCS_PASSWORD}

# CORS — origin ของ frontend (comma-separated)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Swagger UI path mapping (default: /swagger-ui/index.html)
springdoc.swagger-ui.path=/api/docs
springdoc.api-docs.path=/v3/api-docs

# App / LINE / AI / HCode / JWT configuration
app.public-base-url=${APP_PUBLIC_BASE_URL}

line.client-id=${LINE_CLIENT_ID}
line.client-secret=${LINE_CLIENT_SECRET}
line.redirect-uri=${LINE_REDIRECT_URI}
line.channel-access-token=${LINE_CHANNEL_ACCESS_TOKEN}
line.channel-secret=${LINE_CHANNEL_SECRET}
line.liff-url=${LINE_LIFF_URL}

ai.base-url=${AI_SERVICE_URL}
ai.parse-path=${AI_PARSE_PATH}
ai.weather-warning-path=${AI_WEATHER_WARNING_PATH:/weather-warning/summarize}
ai.weather-brief-path=${AI_WEATHER_BRIEF_PATH:/weather-brief/summarize}
ai.agri-price-extract-path=${AI_AGRI_PRICE_EXTRACT_PATH:/agri-price/extract}
ai.agri-price-match-path=${AI_AGRI_PRICE_MATCH_PATH:/agri-price/match}
ai.agri-price-brief-path=${AI_AGRI_PRICE_BRIEF_PATH:/agri-price/summarize}
ai.cycle-summary-path=${AI_CYCLE_SUMMARY_PATH:/cycle-summary/summarize}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS}

hcode.base-url=${HCODE_BASE_URL}
hcode.username=${HCODE_USERNAME}
hcode.password=${HCODE_PASSWORD}
hcode.page-size=${HCODE_PAGE_SIZE}
hcode.timeout-seconds=${HCODE_TIMEOUT_SECONDS}
hcode.data-source=${HCODE_DATA_SOURCE}

agri-price.base-url=${AGRI_PRICE_BASE_URL:https://agriapi.nabc.go.th}
agri-price.timeout-seconds=${AGRI_PRICE_TIMEOUT_SECONDS:20}
agri-price.max-pages=${AGRI_PRICE_MAX_PAGES:3}

weather.base-url=${WEATHER_API_BASE_URL:https://data.tmd.go.th/nwpapi}
weather.token=${WEATHER_API_TOKEN:}
weather.timeout-seconds=${WEATHER_API_TIMEOUT_SECONDS:20}
weather.duration-hours=${WEATHER_API_DURATION_HOURS:24}
weather.warning-url=${WEATHER_WARNING_URL:https://data.tmd.go.th/api/WeatherWarningNews/v2/}
weather.warning-uid=${WEATHER_WARNING_UID:demo}
weather.warning-ukey=${WEATHER_WARNING_UKEY:demokey}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Supabase Storage — product images (path stored in DB; URL built from base + bucket + path)
file-storage.base-url=${FILE_STORAGE_BASE_URL:}
file-storage.service-key=${SUPABASE_SERVICE_KEY:}
file-storage.bucket=${FILE_STORAGE_BUCKET:product}
file-storage.timeout-seconds=${FILE_STORAGE_TIMEOUT_SECONDS:20}

# Allow larger upload then resize down to 500 KB before storing
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:12MB}

# File log — ใน Docker เขียนที่ /app/logs แล้ว mount ไปที่ LineApp/log/user-service
logging.file.name=${LOGGING_FILE_NAME:logs/user-service.log}
logging.logback.rollingpolicy.max-file-size=${LOGGING_MAX_FILE_SIZE:10MB}
logging.logback.rollingpolicy.max-history=${LOGGING_MAX_HISTORY:14}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [reqId=%X{reqId:-}] [%t] %-40.40logger{39} : %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [reqId=%X{reqId:-}] [%t] %-40.40logger{39} : %m%n%wEx