events {}

http {
    limit_req_zone $binary_remote_addr zone=perip:10m rate=100r/s;
    
    upstream frontend_upstream {
        server frontend:5173;
    }
    
    upstream backend_upstream {
        server user-service:8080;
    }
    
    # HTTP → HTTPS (บังคับโดเมนหลัก กัน www กับ apex คนละ origin แล้ว login state หาย)
    server {
        listen 80;
        server_name yaiphao.com www.yaiphao.com;
    
        return 301 https://yaiphao.com$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www.yaiphao.com;

        ssl_certificate /etc/nginx/ssl/origin.crt;
        ssl_certificate_key /etc/nginx/ssl/origin.key;

        return 301 https://yaiphao.com$request_uri;
    }
    
    # HTTPS รอขอ cert
    server {
        listen 443 ssl;
        server_name yaiphao.com;
    
        ssl_certificate /etc/nginx/ssl/origin.crt;
        ssl_certificate_key /etc/nginx/ssl/origin.key;
    
        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
    
            limit_req zone=perip burst=50 nodelay;
            limit_req_status 429;
    
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    
        # springdoc/swagger-ui ใช้ path ที่ไม่ได้ขึ้นต้นด้วย /api (v3/api-docs, swagger-ui/**)
        # ต้อง proxy ไป backend ตรง ๆ ไม่งั้นจะหลุดไปเข้า location / (frontend) แทน
        location /v3/api-docs {
            proxy_pass http://backend_upstream/v3/api-docs;
            proxy_http_version 1.1;
    
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    
        location /swagger-ui/ {
            proxy_pass http://backend_upstream/swagger-ui/;
            proxy_http_version 1.1;
    
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    
        location /webhook {
            proxy_pass http://backend_upstream/webhook;
            proxy_http_version 1.1;
    
            limit_req zone=perip burst=50 nodelay;
            limit_req_status 429;
    
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}